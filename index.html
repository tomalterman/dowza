// ---- Parallax + tile rendering helpers -----------------------------------
//
// drawBackgroundFar/Near are called by game.js from gameRender BEFORE the
// foreground tiles. Both layers are screen-space draws scrolling at fractional
// speed of the world camera, giving a parallax effect.

function drawBackgroundSky(ctx, w, h) {
    // Crimson gradient sky
    const grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, '#2a0608');
    grad.addColorStop(0.55, '#5a1208');
    grad.addColorStop(1, '#7a1a08');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);

    // Three sun/moon glows to break up flat sky
    ctx.fillStyle = 'rgba(255,140,80,0.10)';
    ctx.beginPath();
    ctx.arc(70, 50, 30, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,180,100,0.08)';
    ctx.beginPath();
    ctx.arc(220, 35, 18, 0, Math.PI * 2);
    ctx.fill();
}

function drawBackgroundFar(ctx, w, h, cameraX) {
    // Distant volcanic mountains drawn as 5 silhouettes scrolling at 0.25x.
    const offset = -cameraX * 0.25;
    ctx.fillStyle = '#1a0405';
    const peaks = [
        { x: 0, h: 90, w: 90 },
        { x: 80, h: 110, w: 80 },
        { x: 160, h: 75, w: 100 },
        { x: 250, h: 100, w: 90 },
        { x: 340, h: 85, w: 85 },
        { x: 430, h: 105, w: 95 }
    ];
    // Repeat across the screen so motion is seamless
    for (let pass = -1; pass < 3; pass++) {
        const passOffset = offset + pass * 520;
        for (const p of peaks) {
            const baseX = p.x + passOffset;
            if (baseX > w + 100 || baseX + p.w < -100) continue;
            ctx.beginPath();
            ctx.moveTo(baseX, h);
            ctx.lineTo(baseX + p.w / 2, h - p.h);
            ctx.lineTo(baseX + p.w, h);
            ctx.closePath();
            ctx.fill();
        }
    }
}

function drawBackgroundNear(ctx, w, h, cameraX, time) {
    // Drifting embers in mid-distance, scrolling at 0.6x. Procedural so they
    // don't need persistent state -- compute positions from time + index.
    const offset = -cameraX * 0.6;
    for (let i = 0; i < 18; i++) {
        const seed = i * 37;
        const baseX = ((seed * 13) % 480) + offset;
        const wrappedX = ((baseX % 480) + 480) % 480 - 60;
        if (wrappedX > w + 20 || wrappedX < -20) continue;
        // Vertical drift via slow sine
        const y = ((seed * 7) % (h - 30)) + Math.sin((time * 0.6) + i) * 6;
        const sz = 1 + (i % 3);
        const alpha = 0.45 + 0.4 * Math.sin(time * 1.4 + i);
        ctx.fillStyle = `rgba(255, ${140 + (i % 3) * 30}, 60, ${alpha.toFixed(2)})`;
        ctx.fillRect(wrappedX, y, sz, sz);
    }
}

// ---- Foreground tile rendering ------------------------------------------
//
// Draws only tiles visible in the camera viewport. Each solid tile is
// procedurally textured with a deterministic crack pattern from the tile
// coordinates so it doesn't shimmer between frames.

function drawLevelTiles(ctx, level, cameraX, w, h) {
    const camX = Math.round(cameraX);
    const startTx = Math.max(0, Math.floor(camX / 16));
    const endTx   = Math.min(level.widthT - 1, Math.floor((camX + w) / 16));

    for (let ty = 0; ty < level.heightT; ty++) {
        for (let tx = startTx; tx <= endTx; tx++) {
            const tile = level.tiles[ty][tx];
            if (tile === 0) continue;
            const sx = tx * 16 - camX;
            const sy = ty * 16;
            if (tile === 1) drawSolidTile(ctx, sx, sy, tx, ty);
            else if (tile === 2) drawLavaTile(ctx, sx, sy, tx, ty);
        }
    }
}

function drawSolidTile(ctx, sx, sy, tx, ty) {
    // Base stone
    ctx.fillStyle = '#3a1a14';
    ctx.fillRect(sx, sy, 16, 16);

    // Top highlight (1px lighter band) -- only when there's no solid above
    ctx.fillStyle = '#5a2a18';
    ctx.fillRect(sx, sy, 16, 2);

    // Procedural crack: deterministic from tile coords
    const seed = (tx * 73856093) ^ (ty * 19349663);
    const crackX = (seed & 0x0f);
    const crackY = ((seed >> 4) & 0x0f);
    ctx.fillStyle = '#1a0606';
    ctx.fillRect(sx + crackX % 12 + 1, sy + 4 + (crackY % 8), 2, 1);
    ctx.fillRect(sx + (crackX * 3) % 12 + 1, sy + 9 + (crackY % 5), 1, 2);

    // Glowing lava-vein hint
    if ((seed & 0x07) === 0) {
        ctx.fillStyle = '#cc4014';
        ctx.fillRect(sx + 5, sy + 11, 4, 1);
    }
}

function drawLavaTile(ctx, sx, sy, tx, ty) {
    const time = (typeof gameFrame !== 'undefined' ? gameFrame : 0) / 30;
    const wave = Math.sin(time * 2 + tx * 0.4) * 1.2;
    ctx.fillStyle = '#7a1a04';
    ctx.fillRect(sx, sy, 16, 16);
    ctx.fillStyle = '#cc3818';
    ctx.fillRect(sx, sy + 2 + wave, 16, 12 - wave);
    ctx.fillStyle = '#ff7038';
    ctx.fillRect(sx + 2, sy + 4 + wave, 12, 4 - wave);
    ctx.fillStyle = '#ffcc40';
    ctx.fillRect(sx + 4, sy + 5 + wave, 8, 1);
}


// ---- src/game-entities.js ----
// ==================== GAME ENTITIES ====================
// Dowza, Walker enemy, Fireball projectile, Bowzashine boss. Each entity is
// a plain object created via a factory function. Entity ticks live here;
// sprite rendering lives in game-render.js.
//
// Conventions:
//   - Position (x, y) is the AABB top-left in world pixels.
//   - vx, vy are pixels per fixed tick (1/60 s).
//   - All entities expose w, h for collision; PF_aabbOverlap pairs them.

// =====================================================================
// DOWZA (player) ------------------------------------------------------
// =====================================================================

const DOWZA_W = 12;
const DOWZA_H = 16;

function makeDowza(spawnX, spawnY) {
    return {
        x: spawnX, y: spawnY,
        prevX: spawnX, prevY: spawnY,
        vx: 0, vy: 0,
        w: DOWZA_W, h: DOWZA_H,
        facing: 1,            // 1 = right, -1 = left
        onGround: false,
        coyote: 0,            // frames remaining of post-walkoff jump grace
        buffer: 0,            // frames remaining of queued jump
        jumpHeld: false,      // tracks whether jump is currently held
        prevJumpInput: false, // for rising-edge detection
        prevFireInput: false,
        jumpCutApplied: false, // variable-jump cutoff is one-shot per jump
        fireCooldown: 0,
        hp: 6,
        maxHp: 6,
        iFrames: 0,
        state: 'idle',        // idle | run | jump | fall | hurt
        stateFrames: 0,
        animFrame: 0,
        alive: true,
        prevOnGround: true,   // for landing-detection on air->ground transition
        prevVyForLand: 0,     // landing impact velocity (pre-collision-zero)
        footstepFrame: 0,     // rolling counter for footstep cadence
        // Win-state freeze: when set, Dowza stops accepting input and idles
        frozen: false
    };
}

function dowzaTick(d, level) {
    d.prevX = d.x;
    d.prevY = d.y;
    d.stateFrames++;
    d.animFrame++;
    if (d.fireCooldown > 0) d.fireCooldown--;
    if (d.iFrames > 0) d.iFrames--;

    // ---- Read input (rising edges + held flags) ----
    const left = !d.frozen && Engine.input.left;
    const right = !d.frozen && Engine.input.right;
    const jumpHeld = !d.frozen && Engine.input.jump;
    const jumpEdge = jumpHeld && !d.prevJumpInput;
    const fireHeld = !d.frozen && Engine.input.fire;
    const fireEdge = fireHeld && !d.prevFireInput;
    d.prevJumpInput = jumpHeld;
    d.prevFireInput = fireHeld;

    // ---- Horizontal acceleration / friction ----
    if (left && !right) {
        d.vx -= PF_RUN_ACCEL;
        d.facing = -1;
    } else if (right && !left) {
        d.vx += PF_RUN_ACCEL;
        d.facing = 1;
    } else {
        d.vx *= PF_FRICTION;
        if (Math.abs(d.vx) < 0.05) d.vx = 0;
    }
    if (d.vx > PF_RUN_MAX) d.vx = PF_RUN_MAX;
    if (d.vx < -PF_RUN_MAX) d.vx = -PF_RUN_MAX;

    // ---- Coyote + jump buffer bookkeeping ----
    if (d.onGround) {
        d.coyote = PF_COYOTE_FRAMES;
    } else if (d.coyote > 0) {
        d.coyote--;
    }
    if (jumpEdge) {
        d.buffer = PF_JUMP_BUFFER;
    } else if (d.buffer > 0) {
        d.buffer--;
    }

    // ---- Jump trigger (consume buffer when jumpable) ----
    const canJump = d.coyote > 0 || d.onGround;
    if (d.buffer > 0 && canJump) {
        d.vy = PF_JUMP_VEL;
        d.coyote = 0;
        d.buffer = 0;
        d.onGround = false;
        d.jumpCutApplied = false;
        if (typeof Sound !== 'undefined') Sound.play('jump');
    }

    // ---- Variable jump height: release-jump caps upward velocity ONCE per
    // jump on the held->released transition. Without the one-shot guard, the
    // cutoff multiplies on every released-frame and a 1-tick tap collapses
    // to almost the same height as a 3-tick tap (vy: -6 -> -2.7 -> -1.2 -> ~0).
    if (!jumpHeld && d.vy < 0 && !d.jumpCutApplied) {
        d.vy *= PF_JUMP_CUTOFF;
        d.jumpCutApplied = true;
    }
    if (d.onGround) d.jumpCutApplied = false;

    // ---- Apply gravity ----
    d.vy += PF_GRAVITY;
    if (d.vy > PF_MAX_FALL) d.vy = PF_MAX_FALL;

    // Snapshot impact velocity before collision can zero it -- used to
    // decide whether the landing sound is worth playing.
    d.prevVyForLand = d.vy;

    // ---- Move + collide ----
    PF_moveAndCollide(d, level);

    // ---- Landing thud: airborne -> ground transition with meaningful vy ----
    if (d.onGround && !d.prevOnGround && d.prevVyForLand > 1.6) {
        if (typeof Sound !== 'undefined') Sound.play('land');
    }
    d.prevOnGround = d.onGround;

    // ---- Footstep cadence: tick a counter while running on the ground ----
    if (d.onGround && Math.abs(d.vx) > 0.6) {
        d.footstepFrame++;
        // Step every ~14 ticks at full run speed (slows automatically when
        // vx is smaller because we only increment when moving).
        if (d.footstepFrame >= 14) {
            d.footstepFrame = 0;
            if (typeof Sound !== 'undefined') Sound.play('footstep');
        }
    } else {
        d.footstepFrame = 13; // primed so the next step fires within ~1 frame
    }

    // Clamp horizontally to level bounds (no falling off the world)
    if (d.x < 0) { d.x = 0; d.vx = 0; }
    if (d.x + d.w > level.widthPx) {
        d.x = level.widthPx - d.w;
        d.vx = 0;
    }
    // Below-world safety: shouldn't happen in v1 (no pits) but defensive.
    // Mirror to Engine.state.health and d.alive so the engine's loop.js
    // gameOver path actually fires -- d.hp alone is invisible to the engine.
    if (d.y > level.heightPx + 64) {
        d.hp = 0;
        d.alive = false;
        Engine.state.health = 0;
    }

    // ---- Fire input (entity creation lives here so we can set facing/origin) ----
    if (fireEdge && d.fireCooldown <= 0) {
        spawnFireball(d.x + d.w / 2 + d.facing * 6, d.y + 5, d.facing);
        d.fireCooldown = 18;
        if (typeof Sound !== 'undefined') Sound.play('fireball');
    }

    // ---- State machine ----
    let next = d.state;
    if (d.iFrames > 50) {                  // first ~10 frames after damage flash as hurt
        next = 'hurt';
    } else if (!d.onGround && d.vy < 0) {
        next = 'jump';
    } else if (!d.onGround && d.vy > 0) {
        next = 'fall';
    } else if (d.onGround && Math.abs(d.vx) > 0.15) {
        next = 'run';
    } else if (d.onGround) {
        next = 'idle';
    }
    if (next !== d.state) {
        d.state = next;
        d.stateFrames = 0;
    }
}

// Damage helper: walker contact, shine blast, shielded-boss touch.
function dowzaTakeHit(d, fromX) {
    if (d.iFrames > 0 || !d.alive) return;
    d.hp--;
    d.iFrames = 60;
    // Knockback: away from the hit source, slight upward kick
    const dir = (d.x + d.w / 2 < fromX) ? -1 : 1;
    d.vx = dir * 2.0;
    d.vy = -3.0;
    if (typeof Sound !== 'undefined') Sound.play('playerHit');
    if (d.hp <= 0) {
        d.alive = false;
        Engine.state.health = 0;  // engine will trigger gameOver path
    } else {
        Engine.state.health = d.hp;
    }
}

// Stomp bounce helper: gives Dowza an upward kick after squashing something.
function dowzaStompBounce(d) {
    d.vy = PF_JUMP_VEL * 0.7;
    d.onGround = false;
    d.coyote = 0;
}

// =====================================================================
// WALKER ENEMY --------------------------------------------------------
// =====================================================================
//
// Small fire-imp that paces between patrolMin and patrolMax. Stomp kills it
// (Mario-canon). Fireball kills it. Touching its side costs Dowza 1 HP.

const WALKER_W = 12;
const WALKER_H = 12;
const WALKER_SPEED = 0.65;          // px/tick magnitude
const WALKER_DEATH_FRAMES = 18;     // squash-fade duration before splice

function makeWalker(spec) {
    return {
        x: spec.x, y: spec.y,
        prevX: spec.x, prevY: spec.y,
        vx: -WALKER_SPEED, vy: 0,         // start moving left
        w: WALKER_W, h: WALKER_H,
        patrolMin: spec.patrolMin,
        patrolMax: spec.patrolMax - WALKER_W,  // upper bound is left-edge constraint
        alive: true,
        deathFrames: 0,                    // when >0, walker is dying (squashed render)
        animFrame: 0
    };
}

function walkerTick(w, level) {
    w.prevX = w.x; w.prevY = w.y;
    w.animFrame++;

    if (!w.alive) {
        w.deathFrames++;
        return;
    }

    // Apply gravity + collide so it sits on platforms cleanly
    w.vy += PF_GRAVITY;
    if (w.vy > PF_MAX_FALL) w.vy = PF_MAX_FALL;
    const hit = PF_moveAndCollide(w, level);

    // Reverse on wall contact. Use the constant speed magnitude rather than
    // Math.abs(vx) -- PF_moveAndCollide zeroes vx on the colliding tick, so
    // Math.abs(0) would freeze the walker forever.
    if (hit.hitLeft)  w.vx =  WALKER_SPEED;
    if (hit.hitRight) w.vx = -WALKER_SPEED;

    // Reverse on patrol bounds (use the same constant for the same reason)
    if (w.x <= w.patrolMin && w.vx < 0) w.vx =  WALKER_SPEED;
    if (w.x >= w.patrolMax && w.vx > 0) w.vx = -WALKER_SPEED;
}

// Resolve player-vs-walker contact. Stomp = walker dies + Dowza bounces.
// Side touch = Dowza takes a hit. Returns true if the walker should be kept
// active (alive or in death animation).
function resolvePlayerWalker(d, w) {
    if (!w.alive) return w.deathFrames < WALKER_DEATH_FRAMES;
    if (!PF_aabbOverlap(d, w)) return true;

    // Stomp criterion: previous-frame Dowza-bottom was above walker-top AND
    // current vy is downward. This avoids ambiguous diagonal-touch cases.
    const prevBottom = d.prevY + d.h;
    const wTop = w.y;
    if (d.vy > 0 && prevBottom <= wTop + 2) {
        // STOMP
        w.alive = false;
        w.deathFrames = 1;
        dowzaStompBounce(d);
        if (typeof Sound !== 'undefined') Sound.play('stomp');
        // Squash particles
        for (let i = 0; i < 6; i++) {
            const ang = (i / 6) * Math.PI * 2;
            Engine.spawnParticle(
                w.x + w.w / 2, w.y + w.h / 2,
                Math.cos(ang) * 1.4, Math.sin(ang) * 1.4 - 0.5,
                2, '#ff8040', 22
            );
        }
        return true;
    }

    // Side-touch hurts Dowza
    dowzaTakeHit(d, w.x + w.w / 2);
    return true;
}

// =====================================================================
// FIREBALL PROJECTILE ------------------------------------------------
// =====================================================================
//
// Spawned by Dowza pressing fire. Travels horizontally (no gravity in v1
// for readability), dies on enemy hit, wall hit, or life expiry.

const FIREBALL_W = 6;
const FIREBALL_H = 6;
const FIREBALL_SPEED = 3.6;
const FIREBALL_LIFE = 60;

function spawnFireball(x, y, facing) {
    const fb = {
        x: x - FIREBALL_W / 2, y: y - FIREBALL_H / 2,
        prevX: x - FIREBALL_W / 2, prevY: y - FIREBALL_H / 2,
        vx: FIREBALL_SPEED * facing, vy: 0,
        w: FIREBALL_W, h: FIREBALL_H,
        life: FIREBALL_LIFE,
        alive: true,
        animFrame: 0
    };
    if (!Engine.fireballs) Engine.fireballs = [];
    Engine.fireballs.push(fb);
    return fb;
}

function fireballTick(fb, level) {
    if (!fb.alive) return;
    fb.prevX = fb.x; fb.prevY = fb.y;
    fb.animFrame++;
    fb.life--;
    if (fb.life <= 0) { fb.alive = false; return; }

    // Move + check wall collision via tile sample at leading edge
    fb.x += fb.vx;
    const tx = Math.floor(((fb.vx > 0 ? fb.x + fb.w : fb.x) - 0.001) / PF_TILE);
    const ty = Math.floor((fb.y + fb.h / 2) / PF_TILE);
    if (PF_isSolid(level, tx, ty)) {
        fb.alive = false;
        if (typeof Sound !== 'undefined') Sound.play('fireballWall');
        // Wall sparks
        for (let i = 0; i < 4; i++) {
            Engine.spawnParticle(
                fb.x + fb.w / 2, fb.y + fb.h / 2,
                (Math.random() - 0.5) * 2, -Math.random() * 2,
                1, '#ffcc40', 12
            );
        }
        return;
    }
    // Off-world cleanup
    if (fb.x + fb.w < 0 || fb.x > level.widthPx) fb.alive = false;
}

// Resolve fireball-vs-walker. Returns true if fireball died this call.
function resolveFireballWalker(fb, w) {
    if (!fb.alive || !w.alive) return false;
    if (!PF_aabbOverlap(fb, w)) return false;

    fb.alive = false;
    w.alive = false;
    w.deathFrames = 1;
    if (typeof Sound !== 'undefined') Sound.play('enemyDie');
    for (let i = 0; i < 8; i++) {
        const ang = (i / 8) * Math.PI * 2;
        Engine.spawnParticle(
            w.x + w.w / 2, w.y + w.h / 2,
            Math.cos(ang) * 1.8, Math.sin(ang) * 1.8 - 0.7,
            2, '#ff6028', 26
        );
    }
    return true;
}

// =====================================================================
// BOWZASHINE BOSS -----------------------------------------------------
// =====================================================================
//
// State machine:
//   ENTERING -> SHIELDED -> STUNNED -> SHIELDED -> ... -> DEFEATED
//                ^                       |
//                |       (after stomp)   v
//                +-- DAMAGED (i-frames) -+
//
// SHIELDED  : fires shine-blasts on a timer; touch costs Dowza 1 HP; stomp
//             from Dowza costs Dowza 1 HP (no boss damage); fireball ->
//             STUNNED.
// STUNNED   : 75 frames of vulnerability. Fireballs do nothing in this state
//             (intentional: forces Dowza to commit to the stomp). Stomp -> DAMAGED.
// DAMAGED   : 30 frames i-frames + flash. Returns to SHIELDED unless hp == 0.
// DEFEATED  : 90-frame fall+collapse. Sets Engine.win = true at end.
// ENTERING  : 60-frame rise-from-lava intro on first arena entry.

const BOWZA_W = 36;
const BOWZA_H = 40;
const BOWZA_MAX_HP = 3;

function makeBowzashine(spawnX, spawnY) {
    return {
        x: spawnX, y: spawnY,
        prevX: spawnX, prevY: spawnY,
        vx: 0, vy: 0,
        w: BOWZA_W, h: BOWZA_H,
        hp: BOWZA_MAX_HP,
        state: 'ENTERING',
        stateFrames: 0,
        attackTimer: 110,
        animFrame: 0,
        defeated: false
    };
}

function bowzashineTick(b, dowza, level) {
    b.prevX = b.x; b.prevY = b.y;
    b.stateFrames++;
    b.animFrame++;

    // Ground row 13 -> top y = 208. Boss bottom rests at 208, so resting top = 168.
    const groundY = 13 * 16 - b.h;  // 168 for BOWZA_H=40

    if (b.state === 'ENTERING') {
        // Rise from below the floor over 60 frames: starts ~32px below resting,
        // ends at resting position so feet sit cleanly on the ground tile.
        const t = Math.min(1, b.stateFrames / 60);
        b.y = groundY + (1 - t) * 32;
        if (b.stateFrames >= 60) {
            b.state = 'SHIELDED';
            b.stateFrames = 0;
            b.attackTimer = 60;
        }
        return;
    }

    if (b.state === 'SHIELDED') {
        b.y = groundY + Math.sin(b.animFrame * 0.05) * 1.5;
        b.attackTimer--;
        // Pre-volley telegraph: 12 frames before each volley, play a charge
        // cue so the kid hears the attack coming and can dodge.
        if (b.attackTimer === 12) {
            if (typeof Sound !== 'undefined') Sound.play('shineCharge');
        }
        if (b.attackTimer <= 0) {
            spawnShineVolley(b, dowza);
            b.attackTimer = 130;
        }
        return;
    }

    if (b.state === 'STUNNED') {
        // Wobble lurches sideways more than vertically -- a tiny y-bob keeps
        // the stomp target stable so a kid can land it consistently.
        b.y = groundY + Math.sin(b.animFrame * 0.3) * 0.5;
        if (b.stateFrames >= 75) {
            b.state = 'SHIELDED';
            b.stateFrames = 0;
            b.attackTimer = 80;
        }
        return;
    }

    if (b.state === 'DAMAGED') {
        b.y = groundY + Math.sin(b.animFrame * 0.5) * 2;
        if (b.stateFrames >= 30) {
            if (b.hp <= 0) {
                b.state = 'DEFEATED';
                b.stateFrames = 0;
                // Clear in-flight shines so a stray late blast can't kill
                // Dowza during the win fanfare and produce a confusing
                // simultaneous win+gameOver state. Also grant Dowza victory
                // invulnerability through the rest of the DEFEATED sequence.
                Engine.shineBlasts = [];
                if (Engine.player) Engine.player.iFrames = Math.max(Engine.player.iFrames, 200);
                if (typeof Sound !== 'undefined') Sound.play('bossDefeat');
            } else {
                b.state = 'SHIELDED';
                b.stateFrames = 0;
                b.attackTimer = 60;
            }
        }
        return;
    }

    if (b.state === 'DEFEATED') {
        // Fall into the void: 90 frames of acceleration + particle bursts
        if (b.stateFrames < 90) {
            b.y += 0.6 + b.stateFrames * 0.05;
            // explosion particles
            if (b.stateFrames % 4 === 0) {
                for (let i = 0; i < 6; i++) {
                    const ang = (i / 6) * Math.PI * 2 + Math.random() * 0.4;
                    Engine.spawnParticle(
                        b.x + b.w / 2 + (Math.random() - 0.5) * b.w * 0.6,
                        b.y + b.h / 2,
                        Math.cos(ang) * 2, Math.sin(ang) * 2 - 1,
                        2 + Math.floor(Math.random() * 2),
                        ['#ffcc40', '#ff7028', '#cc3010'][i % 3],
                        24
                    );
                }
            }
        } else if (!b.defeated) {
            b.defeated = true;
            Engine.win = true;
            if (typeof Sound !== 'undefined') Sound.play('win');
        }
        return;
    }
}

// Resolve player-vs-boss contact. Returns nothing; mutates Dowza/boss state.
function resolvePlayerBoss(d, b) {
    if (!d.alive || b.state === 'DEFEATED' || b.state === 'ENTERING') return;
    if (!PF_aabbOverlap(d, b)) return;

    if (b.state === 'STUNNED') {
        // Stomp criterion: was previous-frame bottom above boss top? +8 gives
        // a more forgiving landing window than the +2 used for walkers
        // (the boss is taller and slightly mobile, so kids need extra grace).
        // Side-touch during STUNNED is harmless: a paralyzed boss can't hurt
        // Dowza, so jumping into him from the side is fine. This also avoids
        // the "jumped onto boss but clipped his side first and got damaged
        // before the stomp registered" failure mode.
        const prevBottom = d.prevY + d.h;
        if (d.vy > 0 && prevBottom <= b.y + 8) {
            // DAMAGE
            b.hp--;
            b.state = 'DAMAGED';
            b.stateFrames = 0;
            dowzaStompBounce(d);
            d.vy *= 0.85;  // softer bounce off boss than walker
            if (typeof Sound !== 'undefined') Sound.play('bossHit');
            for (let i = 0; i < 14; i++) {
                const ang = (i / 14) * Math.PI * 2;
                Engine.spawnParticle(
                    b.x + b.w / 2, b.y + 2,
                    Math.cos(ang) * 2.4, Math.sin(ang) * 2.4 - 1,
                    2 + (i % 2),
                    ['#ffe040', '#ffaa20', '#ff6020'][i % 3],
                    32
                );
            }
            return;
        }
    }

    // Side-touch hurts only when the boss is shielded. Stunned + damaged states
    // are vulnerable; harming the kid for jumping into a defenseless boss feels
    // wrong (and would prevent the stomp from ever landing).
    if (b.state === 'SHIELDED') {
        dowzaTakeHit(d, b.x + b.w / 2);
    }
}

// Resolve fireball-vs-boss. Returns true if fireball was consumed.
function resolveFireballBoss(fb, b) {
    if (!fb.alive) return false;
    if (b.state !== 'SHIELDED') return false;  // stuns only happen from SHIELDED
    if (!PF_aabbOverlap(fb, b)) return false;

    fb.alive = false;
    b.state = 'STUNNED';
    b.stateFrames = 0;
    if (typeof Sound !== 'undefined') Sound.play('bossStun');
    // Shield-shatter sparks
    for (let i = 0; i < 16; i++) {
        const ang = (i / 16) * Math.PI * 2;
        Engine.spawnParticle(
            b.x + b.w / 2, b.y + b.h / 2,
            Math.cos(ang) * 2.6, Math.sin(ang) * 2.6,
            2, '#ffe888',
            28
        );
    }
    return true;
}

// =====================================================================
// SHINE BLAST (boss projectile) --------------------------------------
// =====================================================================

const SHINE_W = 8;
const SHINE_H = 8;
const SHINE_LIFE = 110;

function spawnShineVolley(b, target) {
    if (typeof Sound !== 'undefined') Sound.play('shine');
    const cx = b.x + b.w / 2;
    const cy = b.y + b.h * 0.45;
    const tx = target.x + target.w / 2;
    const ty = target.y + target.h / 2;
    const dx = tx - cx, dy = ty - cy;
    const dist = Math.max(1, Math.sqrt(dx * dx + dy * dy));
    const baseVx = dx / dist;
    const baseVy = dy / dist;

    // 3 blasts in a slight fan
    const angles = [-0.18, 0, 0.18];
    if (!Engine.shineBlasts) Engine.shineBlasts = [];
    for (const a of angles) {
        const cosA = Math.cos(a), sinA = Math.sin(a);
        const vx = (baseVx * cosA - baseVy * sinA) * 2.4;
        const vy = (baseVx * sinA + baseVy * cosA) * 2.4;
        Engine.shineBlasts.push({
            x: cx - SHINE_W / 2, y: cy - SHINE_H / 2,
            prevX: cx - SHINE_W / 2, prevY: cy - SHINE_H / 2,
            vx, vy,
            w: SHINE_W, h: SHINE_H,
            life: SHINE_LIFE,
            alive: true,
            animFrame: 0
        });
    }
}

function shineTick(s, level) {
    if (!s.alive) return;
    s.prevX = s.x; s.prevY = s.y;
    s.life--;
    s.animFrame++;
    if (s.life <= 0) { s.alive = false; return; }
    s.x += s.vx;
    s.y += s.vy;
    // Wall hit: any solid tile on path
    const tx = Math.floor((s.x + s.w / 2) / PF_TILE);
    const ty = Math.floor((s.y + s.h / 2) / PF_TILE);
    if (PF_isSolid(level, tx, ty)) {
        s.alive = false;
        for (let i = 0; i < 4; i++) {
            Engine.spawnParticle(
                s.x + s.w / 2, s.y + s.h / 2,
                (Math.random() - 0.5) * 2, (Math.random() - 0.5) * 2,
                1, '#ffe888', 14
            );
        }
    }
}

function resolvePlayerShine(d, s) {
    if (!s.alive || !d.alive) return;
    if (!PF_aabbOverlap(d, s)) return;
    s.alive = false;
    dowzaTakeHit(d, s.x + s.w / 2);
    for (let i = 0; i < 6; i++) {
        Engine.spawnParticle(
            s.x + s.w / 2, s.y + s.h / 2,
            (Math.random() - 0.5) * 2, (Math.random() - 0.5) * 2,
            1, '#ffeeaa', 14
        );
    }
}


// ---- src/game-render.js ----
// ==================== PROCEDURAL PIXEL ART ====================
// All entity rendering. Pure draw functions called from game.js gameRender().
// Procedural Canvas API only -- no images.
//
// Convention: each draw function takes an entity and the camera-x offset, and
// translates entity world coords -> screen coords (entity.x - cameraX).
// Drawing is rect-based pixel art with deliberate chunky pixels.

// =====================================================================
// DOWZA: green-bodied + blue-headed dinosaur with spikes (12x16)
// =====================================================================

function drawDowza(ctx, d, camX) {
    // alive: undefined means a title-screen / overlay fake (always drawn);
    // alive === false means an in-game dead Dowza (don't draw).
    if (!d) return;
    if (d.alive === false) return;
    const sx = Math.round(d.x - camX);
    const sy = Math.round(d.y);

    // i-frames flicker: skip rendering every other frame while invincible
    if (d.iFrames > 0 && Math.floor(d.iFrames / 4) % 2 === 0) return;

    // Foot stance: alternates while running
    let stance = 0;
    if (d.state === 'run') stance = Math.floor(d.animFrame / 6) % 2;
    else if (d.state === 'jump' || d.state === 'fall') stance = 2;
    // hurt -> use stance 0 (will be flickered out anyway)

    const f = d.facing >= 0 ? 1 : -1;
    // Mirror: simplest approach is to compute pixel x relative to the sprite's
    // left edge, but flip for left-facing. We do this by passing a coord
    // transformer.
    const px = (lx) => sx + (f === 1 ? lx : (DOWZA_W - 1 - lx));

    // ---- Body (green) ----
    const bodyTop = sy + 7;
    ctx.fillStyle = '#3aaa3a';  // mid green body
    rectPx(ctx, sx + 2, bodyTop, 8, 7);
    // Body shading
    ctx.fillStyle = '#2a8030';
    rectPx(ctx, sx + 2, bodyTop, 8, 1);
    rectPx(ctx, sx + 2, bodyTop + 6, 8, 1);
    ctx.fillStyle = '#5acc5a';
    rectPx(ctx, sx + 3, bodyTop + 1, 1, 5);

    // Belly (lighter)
    ctx.fillStyle = '#a4e088';
    rectPx(ctx, sx + 4, bodyTop + 2, 4, 3);

    // ---- Body spikes (green, dorsal) ----
    ctx.fillStyle = '#1a601a';
    // 3 dorsal spikes along the back, mirrored by facing
    rectPx(ctx, px(f === 1 ? 1 : 1), bodyTop + 1, 1, 2);
    rectPx(ctx, px(f === 1 ? 1 : 0), bodyTop + 3, 1, 2);
    rectPx(ctx, px(f === 1 ? 1 : 1), bodyTop + 5, 1, 2);

    // ---- Head (blue) ----
    const headTop = sy + 1;
    ctx.fillStyle = '#3070cc';
    rectPx(ctx, sx + 3, headTop, 7, 6);
    // Head shading
    ctx.fillStyle = '#205088';
    rectPx(ctx, sx + 3, headTop, 7, 1);
    ctx.fillStyle = '#5090ee';
    rectPx(ctx, sx + 3, headTop + 1, 1, 4);

    // Snout
    if (f === 1) {
        ctx.fillStyle = '#3070cc';
        rectPx(ctx, sx + 9, headTop + 3, 2, 2);
        ctx.fillStyle = '#205088';
        rectPx(ctx, sx + 10, headTop + 3, 1, 1);
    } else {
        ctx.fillStyle = '#3070cc';
        rectPx(ctx, sx + 1, headTop + 3, 2, 2);
        ctx.fillStyle = '#205088';
        rectPx(ctx, sx + 1, headTop + 3, 1, 1);
    }

    // ---- Head spikes (blue, on top of head) ----
    ctx.fillStyle = '#103060';
    rectPx(ctx, sx + 4, headTop - 1, 1, 1);
    rectPx(ctx, sx + 7, headTop - 1, 1, 1);
    rectPx(ctx, sx + 4, headTop - 2, 1, 1);
    rectPx(ctx, sx + 7, headTop - 2, 1, 1);

    // ---- Eye ----
    ctx.fillStyle = '#fff';
    rectPx(ctx, px(f === 1 ? 8 : 4), headTop + 2, 1, 2);
    ctx.fillStyle = '#000';
    rectPx(ctx, px(f === 1 ? 8 : 4), headTop + 3, 1, 1);

    // ---- Mouth (small smile) ----
    ctx.fillStyle = '#1a4080';
    if (f === 1) {
        rectPx(ctx, sx + 9, headTop + 5, 1, 1);
    } else {
        rectPx(ctx, sx + 2, headTop + 5, 1, 1);
    }

    // ---- Arms ----
    ctx.fillStyle = '#3aaa3a';
    if (d.state === 'idle' || d.state === 'run' || d.state === 'hurt') {
        rectPx(ctx, sx + 1, sy + 9, 2, 3);
        rectPx(ctx, sx + 9, sy + 9, 2, 3);
    } else if (d.state === 'jump') {
        // Arms up
        rectPx(ctx, sx + 0, sy + 7, 2, 3);
        rectPx(ctx, sx + 10, sy + 7, 2, 3);
    } else if (d.state === 'fall') {
        // Arms out
        rectPx(ctx, sx + 0, sy + 9, 2, 3);
        rectPx(ctx, sx + 10, sy + 9, 2, 3);
    }
    ctx.fillStyle = '#2a8030';
    if (d.state === 'idle' || d.state === 'run') {
        rectPx(ctx, sx + 1, sy + 11, 2, 1);
        rectPx(ctx, sx + 9, sy + 11, 2, 1);
    }

    // ---- Legs ----
    ctx.fillStyle = '#2a8030';
    if (stance === 0) {
        rectPx(ctx, sx + 3, sy + 14, 2, 2);
        rectPx(ctx, sx + 7, sy + 14, 2, 2);
    } else if (stance === 1) {
        rectPx(ctx, sx + 2, sy + 14, 2, 2);
        rectPx(ctx, sx + 8, sy + 14, 2, 2);
    } else {
        // jumping: legs together
        rectPx(ctx, sx + 4, sy + 13, 4, 3);
    }
    // Foot tips (darker)
    ctx.fillStyle = '#103018';
    if (stance === 0) {
        rectPx(ctx, sx + 3, sy + 15, 2, 1);
        rectPx(ctx, sx + 7, sy + 15, 2, 1);
    } else if (stance === 1) {
        rectPx(ctx, sx + 2, sy + 15, 2, 1);
        rectPx(ctx, sx + 8, sy + 15, 2, 1);
    } else {
        rectPx(ctx, sx + 4, sy + 15, 4, 1);
    }
}

// =====================================================================
// WALKER: small fire-imp (12x12)
// =====================================================================

function drawWalker(ctx, w, camX) {
    const sx = Math.round(w.x - camX);
    const sy = Math.round(w.y);

    if (!w.alive) {
        // Squash fade: shrink vertically and fade out across deathFrames
        const t = Math.min(1, w.deathFrames / WALKER_DEATH_FRAMES);
        const sh = Math.max(2, Math.round(WALKER_H * (1 - t * 0.85)));
        const yOff = WALKER_H - sh;
        ctx.fillStyle = `rgba(220, 80, 30, ${(1 - t).toFixed(2)})`;
        rectPx(ctx, sx + 1, sy + yOff, WALKER_W - 2, sh);
        return;
    }

    // Body (orange-red)
    ctx.fillStyle = '#cc4018';
    rectPx(ctx, sx + 1, sy + 2, WALKER_W - 2, WALKER_H - 3);
    ctx.fillStyle = '#882010';
    rectPx(ctx, sx + 1, sy + 2, WALKER_W - 2, 1);
    rectPx(ctx, sx + 1, sy + WALKER_H - 2, WALKER_W - 2, 1);
    ctx.fillStyle = '#ff7038';
    rectPx(ctx, sx + 2, sy + 3, 1, WALKER_H - 5);

    // Hot belly glow
    ctx.fillStyle = '#ffaa30';
    rectPx(ctx, sx + 4, sy + 5, 4, 3);
    ctx.fillStyle = '#ffe060';
    rectPx(ctx, sx + 5, sy + 6, 2, 1);

    // Eyes -- look forward
    ctx.fillStyle = '#000';
    if (w.vx >= 0) {
        rectPx(ctx, sx + 7, sy + 4, 1, 2);
        rectPx(ctx, sx + 9, sy + 4, 1, 2);
    } else {
        rectPx(ctx, sx + 2, sy + 4, 1, 2);
        rectPx(ctx, sx + 4, sy + 4, 1, 2);
    }

    // Two little horns (fire imp style)
    ctx.fillStyle = '#601008';
    rectPx(ctx, sx + 3, sy + 1, 1, 1);
    rectPx(ctx, sx + 8, sy + 1, 1, 1);
    rectPx(ctx, sx + 3, sy, 1, 1);
    rectPx(ctx, sx + 8, sy, 1, 1);

    // Feet (alternate while moving)
    const stance = Math.floor(w.animFrame / 8) % 2;
    ctx.fillStyle = '#400808';
    if (stance === 0) {
        rectPx(ctx, sx + 2, sy + WALKER_H - 1, 3, 1);
        rectPx(ctx, sx + 7, sy + WALKER_H - 1, 3, 1);
    } else {
        rectPx(ctx, sx + 3, sy + WALKER_H - 1, 3, 1);
        rectPx(ctx, sx + 6, sy + WALKER_H - 1, 3, 1);
    }
}

// =====================================================================
// FIREBALL (6x6) -- flickers yellow/orange/red over 4 frames
// =====================================================================

function drawFireball(ctx, fb, camX) {
    if (!fb.alive) return;
    const sx = Math.round(fb.x - camX);
    const sy = Math.round(fb.y);
    const phase = Math.floor(fb.animFrame / 3) % 4;
    const colors = [
        ['#ffe060', '#ffaa30', '#ff5018'],   // yellow core
        ['#ffaa30', '#ff7028', '#cc3010'],   // orange
        ['#ff5018', '#cc3010', '#700808'],   // red
        ['#fff8c0', '#ffe060', '#ffaa30']    // bright flash
    ];
    const c = colors[phase];
    // Outer
    ctx.fillStyle = c[2];
    rectPx(ctx, sx, sy + 1, 6, 4);
    rectPx(ctx, sx + 1, sy, 4, 6);
    // Mid
    ctx.fillStyle = c[1];
    rectPx(ctx, sx + 1, sy + 1, 4, 4);
    // Core
    ctx.fillStyle = c[0];
    rectPx(ctx, sx + 2, sy + 2, 2, 2);

    // Tiny trail behind direction of motion
    const trailX = fb.vx > 0 ? sx - 3 : sx + 6;
    ctx.fillStyle = `rgba(255, 200, 60, 0.5)`;
    rectPx(ctx, trailX, sy + 2, 2, 2);
}

// =====================================================================
// BOWZASHINE (36x40) -- big bright dragon-boss
// =====================================================================

function drawBowzashine(ctx, b, camX, time) {
    const sx = Math.round(b.x - camX);
    const sy = Math.round(b.y);

    // Shielded shimmer (golden halo) drawn behind body
    if (b.state === 'SHIELDED') {
        const pulse = 0.4 + Math.sin(time * 6) * 0.2;
        ctx.fillStyle = `rgba(255, 230, 100, ${pulse.toFixed(2)})`;
        rectPx(ctx, sx - 3, sy + 4, b.w + 6, b.h - 4);
        rectPx(ctx, sx, sy - 1, b.w, b.h);
        ctx.fillStyle = `rgba(255, 255, 200, ${(pulse * 0.6).toFixed(2)})`;
        rectPx(ctx, sx - 2, sy + 6, b.w + 4, b.h - 8);
    }

    // Body main mass
    let bodyColor = '#3a2030';     // dark wine-purple base
    let bodyShade = '#5a3050';
    let bodyHi    = '#8060a0';
    if (b.state === 'STUNNED') {
        // dimmer + tint blue
        bodyColor = '#202040';
        bodyShade = '#404068';
        bodyHi    = '#6068a0';
    }
    if (b.state === 'DAMAGED' && Math.floor(b.stateFrames / 3) % 2 === 0) {
        bodyColor = '#ff8848';
        bodyShade = '#ffaa60';
        bodyHi    = '#fff0a0';
    }
    if (b.state === 'DEFEATED') {
        // Burnt/smoking gray-black with hint of red
        const fade = Math.min(1, b.stateFrames / 50);
        bodyColor = fade > 0.5 ? '#1a0a0a' : '#3a1a1a';
        bodyShade = '#2a1010';
        bodyHi    = '#5a2818';
    }

    // Torso
    ctx.fillStyle = bodyColor;
    rectPx(ctx, sx + 4, sy + 12, b.w - 8, b.h - 16);
    // Belly (slightly lighter)
    ctx.fillStyle = bodyHi;
    rectPx(ctx, sx + 10, sy + 18, b.w - 20, b.h - 26);
    // Top shading
    ctx.fillStyle = bodyShade;
    rectPx(ctx, sx + 4, sy + 12, b.w - 8, 2);
    // Bottom shading
    ctx.fillStyle = '#2a1020';
    rectPx(ctx, sx + 4, sy + b.h - 6, b.w - 8, 2);

    // Head (top) -- chunky with two horns
    ctx.fillStyle = bodyColor;
    rectPx(ctx, sx + 8, sy + 4, b.w - 16, 10);
    ctx.fillStyle = bodyShade;
    rectPx(ctx, sx + 8, sy + 4, b.w - 16, 2);
    // Horns
    ctx.fillStyle = '#fff0a0';
    rectPx(ctx, sx + 8, sy, 3, 5);
    rectPx(ctx, sx + b.w - 11, sy, 3, 5);
    ctx.fillStyle = '#ffaa30';
    rectPx(ctx, sx + 9, sy + 1, 1, 3);
    rectPx(ctx, sx + b.w - 10, sy + 1, 1, 3);

    // Eyes (glowing yellow during SHIELDED, dim during STUNNED, red flash on DAMAGED, dark on DEFEATED)
    let eyeColor = '#ffe040';
    let pupilColor = '#000';
    if (b.state === 'STUNNED') eyeColor = '#7080cc';
    if (b.state === 'DAMAGED' && Math.floor(b.stateFrames / 4) % 2 === 0) eyeColor = '#ff4030';
    if (b.state === 'DEFEATED') { eyeColor = '#1a0808'; pupilColor = '#1a0808'; }
    ctx.fillStyle = eyeColor;
    rectPx(ctx, sx + 12, sy + 7, 3, 3);
    rectPx(ctx, sx + b.w - 15, sy + 7, 3, 3);
    ctx.fillStyle = pupilColor;
    if (b.state !== 'STUNNED' && b.state !== 'DEFEATED') {
        rectPx(ctx, sx + 13, sy + 8, 1, 2);
        rectPx(ctx, sx + b.w - 14, sy + 8, 1, 2);
    } else if (b.state === 'STUNNED') {
        // X eyes (stunned look)
        ctx.fillStyle = '#000';
        rectPx(ctx, sx + 12, sy + 7, 1, 1);
        rectPx(ctx, sx + 14, sy + 9, 1, 1);
        rectPx(ctx, sx + 12, sy + 9, 1, 1);
        rectPx(ctx, sx + 14, sy + 7, 1, 1);
        rectPx(ctx, sx + b.w - 15, sy + 7, 1, 1);
        rectPx(ctx, sx + b.w - 13, sy + 9, 1, 1);
        rectPx(ctx, sx + b.w - 15, sy + 9, 1, 1);
        rectPx(ctx, sx + b.w - 13, sy + 7, 1, 1);
    }

    // Mouth -- crossed-arms-during-shielded means mouth closed; open during STUNNED
    if (b.state === 'STUNNED') {
        ctx.fillStyle = '#1a0808';
        rectPx(ctx, sx + b.w / 2 - 3, sy + 11, 6, 2);
    } else if (b.state !== 'DEFEATED') {
        ctx.fillStyle = '#3a1a1a';
        rectPx(ctx, sx + b.w / 2 - 2, sy + 12, 4, 1);
    }

    // Arms crossed during SHIELDED, dropped during others
    ctx.fillStyle = bodyColor;
    if (b.state === 'SHIELDED') {
        // crossed arms across the chest (X shape)
        rectPx(ctx, sx + 5, sy + 18, 14, 3);
        rectPx(ctx, sx + b.w - 19, sy + 22, 14, 3);
    } else {
        rectPx(ctx, sx + 1, sy + 18, 5, 8);
        rectPx(ctx, sx + b.w - 6, sy + 18, 5, 8);
    }
    ctx.fillStyle = bodyShade;
    if (b.state === 'SHIELDED') {
        rectPx(ctx, sx + 5, sy + 18, 14, 1);
    }

    // Spikes on the back row (silhouetted; visible above shoulders)
    ctx.fillStyle = '#fff0a0';
    rectPx(ctx, sx + 2, sy + 16, 2, 2);
    rectPx(ctx, sx + b.w - 4, sy + 16, 2, 2);
    rectPx(ctx, sx + 2, sy + 22, 2, 2);
    rectPx(ctx, sx + b.w - 4, sy + 22, 2, 2);
    ctx.fillStyle = '#ff8838';
    rectPx(ctx, sx + 2, sy + 17, 1, 1);
    rectPx(ctx, sx + b.w - 4, sy + 17, 1, 1);

    // Feet (chunky claws)
    ctx.fillStyle = '#1a0808';
    rectPx(ctx, sx + 6, sy + b.h - 4, 7, 4);
    rectPx(ctx, sx + b.w - 13, sy + b.h - 4, 7, 4);
    ctx.fillStyle = '#fff0a0';
    rectPx(ctx, sx + 7, sy + b.h - 1, 1, 1);
    rectPx(ctx, sx + 11, sy + b.h - 1, 1, 1);
    rectPx(ctx, sx + b.w - 12, sy + b.h - 1, 1, 1);
    rectPx(ctx, sx + b.w - 8, sy + b.h - 1, 1, 1);
}

// =====================================================================
// SHINE BLAST (8x8) -- bright yellow projectile with white core
// =====================================================================

function drawShineBlast(ctx, s, camX) {
    if (!s.alive) return;
    const sx = Math.round(s.x - camX);
    const sy = Math.round(s.y);
    const phase = Math.floor(s.animFrame / 4) % 2;
    // Outer
    ctx.fillStyle = '#ffaa20';
    rectPx(ctx, sx, sy + 1, 8, 6);
    rectPx(ctx, sx + 1, sy, 6, 8);
    // Mid
    ctx.fillStyle = phase === 0 ? '#ffe040' : '#fff088';
    rectPx(ctx, sx + 1, sy + 1, 6, 6);
    // Core
    ctx.fillStyle = '#fff';
    rectPx(ctx, sx + 3, sy + 3, 2, 2);

    // Sparkle trail
    if (phase === 0) {
        ctx.fillStyle = `rgba(255, 240, 140, 0.6)`;
        rectPx(ctx, sx - Math.sign(s.vx) * 2 + 3, sy + 3, 1, 1);
    }
}

// =====================================================================
// Pixel-snap rect helper. Canvas fillRect with floats causes anti-aliasing
// blur on pixel art -- snap to integers and ensure no negative widths.
// =====================================================================

function rectPx(ctx, x, y, w, h) {
    if (w <= 0 || h <= 0) return;
    ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
}


// ---- src/game.js ----
// ==================== DOWZA: GAME ORCHESTRATOR ====================
// Engine calls (per frame): gameUpdate(dt), gameRender(ctx, w, h),
// gameTitleRender(ctx, w, h, time), gameOverRender(ctx, w, h).
// Engine calls gameInit() on game start and on restart (after taking i-frames-
// triggered HP=0 game over). All entity/world state is rebuilt from scratch
// in gameInit so restart is clean.

document.title = GAME.title;

// Track total elapsed frames (used for animation phases in render).
let gameFrame = 0;

function gameInit() {
    // Engine HP UI uses these. Dowza has 6 HP per the brainstorm.
    Engine.state.health = 6;
    Engine.state.maxHealth = 6;
    Engine.state.score = 0;       // suppress engine high-score path

    // Core state
    Engine.player = makeDowza(LEVEL.playerSpawn.x, LEVEL.playerSpawn.y);
    Engine.walkers = LEVEL.walkerSpawns.map(makeWalker);
    Engine.fireballs = [];
    Engine.shineBlasts = [];
    Engine.bowzashine = null;     // spawned when Dowza enters arena
    Engine.arenaTriggered = false;
    Engine.win = false;
    Engine.winFrames = 0;

    // Camera
    Engine.camera = PF_cameraInit();

    // Physics accumulator state for fixed-timestep wrapper
    Engine.physAcc = { acc: 0 };

    gameFrame = 0;
}

function gameUpdate(engineDt) {
    PF_step(Engine.physAcc, engineDt, function (dt) {
        physicsTick(dt);
    });
}

function physicsTick(dt) {
    gameFrame++;

    const d = Engine.player;
    if (!d) return;

    dowzaTick(d, LEVEL);

    for (let i = 0; i < Engine.walkers.length; i++) {
        const w = Engine.walkers[i];
        walkerTick(w, LEVEL);
        const keep = resolvePlayerWalker(d, w);
        if (!keep) { Engine.walkers.splice(i, 1); i--; }
    }

    for (let i = 0; i < Engine.fireballs.length; i++) {
        const fb = Engine.fireballs[i];
        fireballTick(fb, LEVEL);
        if (fb.alive) {
            for (const w of Engine.walkers) {
                if (resolveFireballWalker(fb, w)) break;
            }
        }
        if (fb.alive && Engine.bowzashine) {
            resolveFireballBoss(fb, Engine.bowzashine);
        }
        if (!fb.alive) { Engine.fireballs.splice(i, 1); i--; }
    }

    if (!Engine.arenaTriggered && d.x + d.w / 2 >= LEVEL.arena.triggerX) {
        Engine.arenaTriggered = true;
        Engine.camera.lockMin = LEVEL.arena.cameraLockMin;
        Engine.camera.lockMax = LEVEL.arena.cameraLockMax;
        Engine.bowzashine = makeBowzashine(LEVEL.arena.bossSpawn.x, LEVEL.arena.bossSpawn.y);
        if (typeof Sound !== 'undefined') Sound.play('arenaApproach');
    }

    // Once the arena is locked, prevent Dowza from walking back left of the
    // gate (camera locks at minTileX*16, so a kid wandering further left
    // ends up off-screen). The level has no left wall there, so we enforce
    // a soft barrier here.
    if (Engine.arenaTriggered && d.x < LEVEL.arena.triggerX) {
        d.x = LEVEL.arena.triggerX;
        if (d.vx < 0) d.vx = 0;
    }

    if (Engine.bowzashine) {
        bowzashineTick(Engine.bowzashine, d, LEVEL);
        resolvePlayerBoss(d, Engine.bowzashine);
    }

    for (let i = 0; i < Engine.shineBlasts.length; i++) {
        const s = Engine.shineBlasts[i];
        shineTick(s, LEVEL);
        if (s.alive) resolvePlayerShine(d, s);
        if (!s.alive) { Engine.shineBlasts.splice(i, 1); i--; }
    }

    PF_cameraFollow(Engine.camera, d, LEVEL, GAME.width);

    if (Engine.win) {
        d.frozen = true;
        Engine.winFrames++;
    }
}

function gameRender(ctx, w, h) {
    const camX = PF_cameraSnapX(Engine.camera);
    const time = gameFrame / 60;

    drawBackgroundSky(ctx, w, h);
    drawBackgroundFar(ctx, w, h, camX);
    drawBackgroundNear(ctx, w, h, camX, time);
    drawLevelTiles(ctx, LEVEL, camX, w, h);

    // Decorative arena gate flames (visible when Dowza is near the arena entrance).
    if (camX + w >= LEVEL.arena.triggerX - 16 && camX <= LEVEL.arena.triggerX + 16) {
        drawArenaGate(ctx, LEVEL.arena.triggerX - camX, time);
    }

    for (const wk of Engine.walkers) drawWalker(ctx, wk, camX);
    for (const fb of Engine.fireballs) drawFireball(ctx, fb, camX);
    if (Engine.bowzashine) drawBowzashine(ctx, Engine.bowzashine, camX, time);
    for (const s of Engine.shineBlasts) drawShineBlast(ctx, s, camX);
    drawDowza(ctx, Engine.player, camX);

    if (Engine.bowzashine && Engine.bowzashine.state !== 'ENTERING' && !Engine.win) {
        drawBossHpBar(ctx, Engine.bowzashine);
    }

    if (Engine.win) {
        drawWinScreen(ctx, w, h, Engine.winFrames);
    }
}

function gameTitleRender(ctx, w, h, time) {
    drawTitleBackdrop(ctx, w, h, time);
}

function gameOverRender(ctx, w, h) {
    if (Engine.player && Engine.camera) {
        const camX = PF_cameraSnapX(Engine.camera);
        drawBackgroundSky(ctx, w, h);
        drawBackgroundFar(ctx, w, h, camX);
        drawLevelTiles(ctx, LEVEL, camX, w, h);
        for (const wk of Engine.walkers) drawWalker(ctx, wk, camX);
        if (Engine.bowzashine) drawBowzashine(ctx, Engine.bowzashine, camX, gameFrame / 60);
        drawDowza(ctx, Engine.player, camX);
    }
}

// ---- Win screen overlay -------------------------------------------------
function drawWinScreen(ctx, w, h, winFrames) {
    const alpha = Math.min(0.7, winFrames / 90);
    ctx.fillStyle = `rgba(40, 8, 4, ${alpha.toFixed(2)})`;
    ctx.fillRect(0, 0, w, h);

    if (winFrames < 30) return;

    ctx.textAlign = 'center';
    ctx.fillStyle = '#000';
    ctx.font = 'bold 26px monospace';
    ctx.fillText('DOWZA WINS!', w / 2 + 2, h / 2 - 18 + 2);
    ctx.fillStyle = '#ffd700';
    ctx.fillText('DOWZA WINS!', w / 2, h / 2 - 18);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 11px monospace';
    ctx.fillText('BOWZASHINE DEFEATED', w / 2, h / 2 + 4);

    if (winFrames > 90 && Math.sin(winFrames / 12) > 0) {
        ctx.fillStyle = '#aaa';
        ctx.font = '10px monospace';
        ctx.fillText('Press SPACE or tap to play again', w / 2, h / 2 + 28);
    }

    ctx.textAlign = 'left';
}

// ---- Window-blur input clear --------------------------------------------
//
// Browsers don't deliver keyup to a defocused window, so a kid alt-tabbing
// while holding right or jump comes back to a Dowza that's been
// auto-running. Clear all input flags on blur and visibility-change so the
// game pauses cleanly. (The animation frame keeps ticking but with no input
// Dowza decelerates and idles.)

window.addEventListener('blur', function () {
    if (Engine && Engine.input) {
        for (const k in Engine.input) Engine.input[k] = false;
    }
});
document.addEventListener('visibilitychange', function () {
    if (document.hidden && Engine && Engine.input) {
        for (const k in Engine.input) Engine.input[k] = false;
    }
});

// ---- Win-screen restart hook --------------------------------------------
//
// The engine's input.js handles restart on the gameOver state. Win is our
// state, so we add our own listener that fires when the win overlay has been
// up for >= 60 frames (lockout to avoid accidental skip during the fanfare).
//
// Belt-and-suspenders against three real races:
//   1. shouldRestart() asserts !gameOver && !showTitleScreen so a stale
//      Engine.win flag can never trigger a phantom restart.
//   2. keydown stopImmediatePropagation prevents the same Space/W/Up
//      keypress from also reaching the engine's input handler and setting
//      Engine.input.jump for the first frame of the new run.
//   3. Click/touch listener is scoped to gameContainer (and skips taps on
//      touchControls / muteBtn) so touch-button presses during win don't
//      bubble to a window-level restart.

(function installWinRestartHook() {
    const winFrameThreshold = 60;
    function shouldRestart() {
        return Engine.win
            && Engine.winFrames > winFrameThreshold
            && !Engine.state.gameOver
            && !Engine.state.showTitleScreen;
    }
    document.addEventListener('keydown', function (e) {
        if (!shouldRestart()) return;
        if (['Space', 'Enter', 'KeyJ', 'KeyZ', 'ArrowUp', 'KeyW'].includes(e.code)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            restartGame();
        }
    }, true);  // capture phase so we beat the engine's listener
    function tapRestart(e) {
        if (!shouldRestart()) return;
        // Skip taps on the touch buttons / mute button -- those have their
        // own handlers and shouldn't double-fire as restart.
        const t = e.target;
        if (t && t.closest && (t.closest('#touchControls') || t.closest('#muteBtn'))) return;
        restartGame();
    }
    const container = document.getElementById('gameContainer') || document;
    container.addEventListener('click', tapRestart);
    container.addEventListener('touchstart', tapRestart, { passive: true });
})();

// ---- Override engine drawUI to suppress the SCORE label ------------------
//
// Dowza is a beat-the-boss game, not a score-chase, so we hide the engine's
// "SCORE: 000000" overlay. JS function-hoisting in the concatenated bundle
// means this declaration overrides the one in src/engine/screens.js because
// game.js loads after it. Hearts (HP) are kept verbatim.

function drawUI(ctx) {
    // Health hearts only -- skip the score line
    ctx.textAlign = 'right';
    ctx.fillStyle = '#ff4757';
    ctx.font = '14px monospace';
    for (let i = 0; i < Engine.state.maxHealth; i++) {
        const x = GAME.width - 16 - i * 14;
        const y = 14;
        if (i < Engine.state.health) {
            drawHeart(ctx, x, y, 5, '#ff4757');
        } else {
            drawHeart(ctx, x, y, 5, '#333');
        }
    }
    ctx.textAlign = 'left';
}

// ---- HUD: boss HP bar ---------------------------------------------------
function drawBossHpBar(ctx, b) {
    const x = 96, y = 6, w = 192, h = 8;
    ctx.fillStyle = '#000';
    ctx.fillRect(x - 2, y - 2, w + 4, h + 4);
    ctx.fillStyle = '#330';
    ctx.fillRect(x, y, w, h);
    const pct = b.hp / 3;
    ctx.fillStyle = '#ffaa20';
    ctx.fillRect(x, y, Math.max(0, w * pct), h);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 8px monospace';
    ctx.fillText('BOWZASHINE', x + w / 2, y - 4);
    ctx.textAlign = 'left';
}

// ---- Decorative arena gate flames ---------------------------------------
function drawArenaGate(ctx, screenX, time) {
    for (let i = 0; i < 7; i++) {
        const flameY = 80 + i * 14;
        const flicker = Math.sin(time * 4 + i * 1.3) * 2;
        ctx.fillStyle = '#ffaa30';
        ctx.fillRect(screenX - 2, flameY + flicker, 4, 6);
        ctx.fillStyle = '#ffe060';
        ctx.fillRect(screenX - 1, flameY + flicker + 1, 2, 3);
    }
}

// ---- Title screen backdrop ----------------------------------------------
function drawTitleBackdrop(ctx, w, h, time) {
    drawBackgroundSky(ctx, w, h);
    drawBackgroundFar(ctx, w, h, time * 30);
    drawBackgroundNear(ctx, w, h, time * 30, time);

    // Ground strip
    ctx.fillStyle = '#3a1a14';
    ctx.fillRect(0, h - 28, w, 28);
    ctx.fillStyle = '#5a2a18';
    ctx.fillRect(0, h - 28, w, 2);

    // Idle Dowza near center
    const bob = Math.sin(time * 2) * 0.6;
    const fake = {
        x: w / 2 - DOWZA_W / 2,
        y: h - 28 - DOWZA_H + bob,
        prevY: h - 28 - DOWZA_H + bob,
        w: DOWZA_W, h: DOWZA_H,
        facing: 1,
        state: 'idle',
        animFrame: Math.floor(time * 8),
        iFrames: 0
    };
    drawDowza(ctx, fake, 0);

    // Atmospheric tagline below the engine's subtitle
    ctx.fillStyle = 'rgba(255, 80, 30, 0.85)';
    ctx.font = '8px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('beat the boss of the fire world', w / 2, h / 2 + 38);
    ctx.textAlign = 'left';
}
